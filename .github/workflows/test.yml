name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      # An empty githubToken (it defaults to the workflow's token) stops the action posting a
      # second check whose conclusion is always neutral, which reads as "skipped" next to this
      # job. The job still fails when a test fails, since the runner exits non-zero, and the
      # next step puts the results in the job summary.
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.22f1
          testMode: editmode
          githubToken: ''

      - name: Summarize results
        if: always()
        shell: python
        env:
          RESULTS: ${{ steps.tests.outputs.artifactsPath }}/editmode-results.xml
        run: |
          import os
          import xml.etree.ElementTree as ET

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              path = os.environ["RESULTS"]
              if not os.path.isfile(path):
                  out.write("### EditMode tests: no results\n\nThe test run produced no results file. See the job log.\n")
                  raise SystemExit(0)
              run = ET.parse(path).getroot()
              a = run.attrib
              out.write(
                  f"### EditMode tests: {a.get('passed', '?')}/{a.get('total', '?')} passed, "
                  f"{a.get('failed', '?')} failed, {a.get('inconclusive', '?')} inconclusive, "
                  f"{a.get('skipped', '?')} skipped "
                  f"({float(a.get('duration', 0)):.1f} s)\n\n"
              )
              # The test runner fails the job on an Inconclusive test (an Assume.That that
              # didn't hold), so list those beside the failures.
              for case in run.iter("test-case"):
                  result = case.get("result")
                  if result == "Failed":
                      mark, message = "❌", case.findtext("failure/message")
                  elif result == "Inconclusive":
                      mark, message = "❔ inconclusive", case.findtext("reason/message")
                  else:
                      continue
                  lines = (message or "").strip().splitlines()
                  out.write(f"- {mark} `{case.get('fullname')}`: {' '.join(l.strip() for l in lines[:2])}\n")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
