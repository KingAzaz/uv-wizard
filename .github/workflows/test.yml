name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      # No githubToken: with one, the action also posts an "EditMode test results" check whose
      # conclusion is always neutral, which reads as "skipped" next to this job. Without it the
      # job still fails when a test fails (the runner exits non-zero), and the next step puts the
      # results in the job summary.
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.22f1
          testMode: editmode

      - name: Summarize results
        if: always()
        shell: python
        env:
          RESULTS: ${{ steps.tests.outputs.artifactsPath }}/editmode-results.xml
        run: |
          import os
          import xml.etree.ElementTree as ET

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              path = os.environ["RESULTS"]
              if not os.path.isfile(path):
                  out.write("### EditMode tests: no results\n\nThe test run produced no results file. See the job log.\n")
                  raise SystemExit(0)
              run = ET.parse(path).getroot()
              a = run.attrib
              out.write(
                  f"### EditMode tests: {a.get('passed', '?')}/{a.get('total', '?')} passed, "
                  f"{a.get('failed', '?')} failed, {a.get('skipped', '?')} skipped "
                  f"({float(a.get('duration', 0)):.1f} s)\n\n"
              )
              for case in run.iter("test-case"):
                  if case.get("result") != "Failed":
                      continue
                  message = (case.findtext("failure/message") or "").strip().splitlines()
                  out.write(f"- ❌ `{case.get('fullname')}`: {message[0] if message else ''}\n")

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
