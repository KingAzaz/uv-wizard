name: Merge gate

# A required check on main. It fails while something should hold a PR's merge: a hold label, or a
# changes-requested review from someone with write access. See .github/scripts/merge_gate.py. It
# reads the PR's state live, so it runs again on every label or review change.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

# One run at a time per PR, in order, so the last run to finish read the latest state.
concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Merge gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Test the gate and the checkout lease
        working-directory: .github/scripts
        run: python -m unittest test_merge_gate test_checkout_lease

      - name: Check what holds the merge
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python merge_gate.py
